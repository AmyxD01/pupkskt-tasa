// Otomatis menyesuaikan total soal berdasarkan isi bank soal (Sekarang Genap 100)
let totalQuestionsInExam = 0; 
const questionsPerPage = 10;
let timeRemaining = 600; // 10 Menit

let examQuestions = [];
let userAnswers = [];
let currentPage = 0;
let timerInterval;
let currentUser = "";

function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

// Menyiapkan soal untuk format ESAI dengan pendeteksi pintar
function prepareExamQuestions() {
    let puQuestions = rawData.filter(q => q[0] === "PU").map(q => ({
        category: q[0], text: q[1], correctAnswer: q.length < 5 ? q[2] : q[q[6] + 2]
    }));
    
    let pkQuestions = rawData.filter(q => q[0] === "PK").map(q => ({
        category: q[0], text: q[1], correctAnswer: q.length < 5 ? q[2] : q[q[6] + 2]
    }));
    
    let sejarahQuestions = rawData.filter(q => q[0] === "Sejarah Tangerang").map(q => ({
        category: q[0], text: q[1], correctAnswer: q.length < 5 ? q[2] : q[q[6] + 2]
    }));

    shuffle(puQuestions);
    shuffle(pkQuestions);
    shuffle(sejarahQuestions);

    let selectedPU = puQuestions.slice(0, 40); // Akan ambil 40 dari 50 persediaan
    let selectedPK = pkQuestions.slice(0, 40); // Akan ambil 40 dari 50 persediaan
    let selectedSejarah = sejarahQuestions.slice(0, 20); // Akan ambil 20 dari persediaan

    let combinedQuestions = [...selectedPU, ...selectedPK, ...selectedSejarah];
    shuffle(combinedQuestions);

    examQuestions = combinedQuestions;
    totalQuestionsInExam = examQuestions.length; // Otomatis menjadi 100
}

function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

function startExam() {
    const nameInput = document.getElementById("participantName").value.trim();
    if(!nameInput) {
        alert("Harap masukkan nama Anda terlebih dahulu!");
        return;
    }
    
    currentUser = nameInput;
    document.getElementById("displayName").textContent = currentUser;
    
    prepareExamQuestions();
    
    userAnswers = new Array(totalQuestionsInExam).fill("");
    currentPage = 0;
    timeRemaining = 600; 
    
    renderPage();
    switchScreen('screenExam');
    
    document.getElementById("timeDisplay").textContent = formatTime(timeRemaining);
    timerInterval = setInterval(() => {
        timeRemaining--;
        document.getElementById("timeDisplay").textContent = formatTime(timeRemaining);
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            forceSubmitExam();
        }
    }, 1000);
}

function retakeExam() {
    prepareExamQuestions();
    
    userAnswers = new Array(totalQuestionsInExam).fill("");
    currentPage = 0;
    timeRemaining = 600;
    
    renderPage();
    switchScreen('screenExam');
    
    clearInterval(timerInterval);
    document.getElementById("timeDisplay").textContent = formatTime(timeRemaining);
    timerInterval = setInterval(() => {
        timeRemaining--;
        document.getElementById("timeDisplay").textContent = formatTime(timeRemaining);
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            forceSubmitExam();
        }
    }, 1000);
}

function renderPage() {
    const container = document.getElementById("questionsContainer");
    container.innerHTML = "";
    
    const startIndex = currentPage * questionsPerPage;
    const endIndex = Math.min(startIndex + questionsPerPage, totalQuestionsInExam);
    
    const pageQuestions = examQuestions.slice(startIndex, endIndex);
    
    pageQuestions.forEach((q, localIndex) => {
        const globalIndex = startIndex + localIndex;
        let currentAnswer = userAnswers[globalIndex];
        
        container.innerHTML += `
            <div class="question-card">
                <div class="question-category">${q.category}</div>
                <div class="question-text">${globalIndex + 1}. ${q.text}</div>
                <div class="options">
                    <textarea class="essay-input" rows="2" placeholder="Ketik jawaban Anda di sini..." oninput="saveAnswer(${globalIndex}, this.value)">${currentAnswer}</textarea>
                </div>
            </div>
        `;
    });
    
    updatePaginationUI();
    window.scrollTo(0, 0);
}

function saveAnswer(globalIndex, value) {
    userAnswers[globalIndex] = value;
}

function changePage(direction) {
    currentPage += direction;
    renderPage();
}

function updatePaginationUI() {
    const totalPages = Math.ceil(totalQuestionsInExam / questionsPerPage);
    document.getElementById("progressInfo").textContent = `Halaman ${currentPage + 1} dari ${totalPages} (Soal ${currentPage * 10 + 1} - ${Math.min((currentPage + 1) * 10, totalQuestionsInExam)})`;
    
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnSubmit = document.getElementById("btnSubmit");
    
    btnPrev.disabled = (currentPage === 0);
    
    if (currentPage === totalPages - 1) {
        btnNext.style.display = "none";
        btnSubmit.style.display = "inline-block";
    } else {
        btnNext.style.display = "inline-block";
        btnSubmit.style.display = "none";
    }
}

function submitExam() {
    if(confirm("Apakah Anda yakin ingin mengumpulkan seluruh jawaban Anda?")) {
        processResults();
    }
}

function forceSubmitExam() {
    alert("Waktu pengerjaan habis! Sistem mengumpulkan jawaban Anda otomatis.");
    processResults();
}

// LOGIKA PENILAIAN ESAI
function processResults() {
    clearInterval(timerInterval);

    let correctCount = 0;

    examQuestions.forEach((q, index) => {
        // Mengubah huruf menjadi kecil semua & menghapus spasi awal/akhir agar pengecekan lebih adil
        let userAns = userAnswers[index].toString().toLowerCase().trim();
        let correctAns = q.correctAnswer.toString().toLowerCase().trim();
        
        if(userAns === correctAns) {
            correctCount++;
        }
    });

    const finalScore = Math.round((correctCount / totalQuestionsInExam) * 100);

    document.getElementById("resultName").textContent = currentUser;
    document.getElementById("resultScore").textContent = finalScore;
    document.getElementById("resultDetail").textContent = `Anda berhasil menjawab ejaan dengan tepat ${correctCount} dari total ${totalQuestionsInExam} soal.`;
    
    let db = JSON.parse(localStorage.getItem('pramukaTulisDb') || '[]');
    let pastAttempts = db.filter(entry => entry.nama.toLowerCase() === currentUser.toLowerCase());
    
    const prevContainer = document.getElementById("previousScoresContainer");
    const prevList = document.getElementById("previousScoresList");
    prevList.innerHTML = "";

    if (pastAttempts.length > 0) {
        prevContainer.style.display = "block";
        pastAttempts.forEach((attempt, idx) => {
            let li = document.createElement("li");
            li.innerHTML = `<span>Percobaan ${idx + 1} (${attempt.waktu})</span> <strong>Skor: ${attempt.nilai}</strong>`;
            prevList.appendChild(li);
        });
    } else {
        prevContainer.style.display = "none";
    }
    
    saveToDatabase(currentUser, finalScore, correctCount, totalQuestionsInExam);
    
    switchScreen('screenResult');
    window.scrollTo(0,0);
}

function saveToDatabase(name, score, correct, total) {
    let now = new Date();
    let dateStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID');
    
    let db = JSON.parse(localStorage.getItem('pramukaTulisDb') || '[]');
    db.push({ nama: name, nilai: score, benar: correct, totalSoal: total, waktu: dateStr });
    localStorage.setItem('pramukaTulisDb', JSON.stringify(db));

    let formData = new FormData();
    formData.append('action', 'insert');
    formData.append('waktu', dateStr);
    formData.append('nama', name);
    formData.append('nilai', score);
    formData.append('benar', correct);
    formData.append('totalSoal', total);

    fetch(scriptURL, { 
        method: 'POST', 
        body: formData 
    })
    .then(response => console.log('Data berhasil terkirim ke Google Sheets!'))
    .catch(error => console.error('Gagal mengirim data!', error.message));
}

function clearDatabase() {
    if(confirm("AWAS: Anda yakin ingin menghapus seluruh riwayat di perangkat ini?")) {
        localStorage.removeItem('pramukaTulisDb');
        alert("Seluruh riwayat berhasil dihapus.");
    }
}
