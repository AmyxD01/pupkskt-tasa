    <style>

        .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        h1 { text-align: center; color: var(--primary-color); margin-top: 0; }
        .subtitle { text-align: center; color: #667085; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: center; }
        .form-group input[type="text"] { padding: 12px 15px; font-size: 16px; border: 1px solid #d9dee5; border-radius: 8px; width: 100%; max-width: 350px; text-align: center; }
        button { border: 0; border-radius: 8px; padding: 12px 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
        .btn-primary { background: var(--success-color); color: #fff; width: 100%; max-width: 350px; }
        .btn-secondary { background: var(--accent-color); color: #fff; width: 100%; max-width: 350px; }
        .btn-admin { background: #344054; color: #fff; margin-top: 20px; font-size: 13px; }
        
        .exam-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee; position: sticky; top: 0; background: #fff; z-index: 10; padding-top: 10px;}
        .timer { font-size: 22px; font-weight: 700; color: var(--secondary-color); background: #fef3f2; padding: 5px 15px; border-radius: 6px; border: 1px solid #fecdca; }
        
        .progress-info { text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--accent-color); font-size: 18px; }
        
        .question-card { background: #fafbfc; border: 1px solid #e1e4e8; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .question-category { display: inline-block; background: var(--accent-color); color: white; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .question-text { font-size: 16px; font-weight: 600; margin-bottom: 15px; }
        
        /* Format Pilihan Ganda */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-label { display: flex; align-items: center; padding: 10px 15px; border: 1px solid #d9dee5; border-radius: 6px; cursor: pointer; transition: 0.2s; background: #fff; }
        .option-label:hover { background: #f1f8ff; border-color: var(--accent-color); }
        .option-label input[type="radio"] { margin-right: 15px; transform: scale(1.2); cursor: pointer;}
        
        .pagination { display: flex; justify-content: space-between; border-top: 2px solid #eee; padding-top: 20px; margin-top: 10px; }
        .btn-nav { background: var(--accent-color); color: #fff; max-width: 150px; }
        .btn-submit { background: var(--success-color); color: #fff; max-width: 200px; display: none; }
        
        .result-box { text-align: center; }
        .score { font-size: 70px; font-weight: 900; color: var(--success-color); margin: 10px 0; }
        
        .history-box { max-width: 400px; margin: 25px auto 0 auto; text-align: left; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #d9dee5; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

</head>

<div class="container">
    <!-- ================= HTML ================= -->
    <div id="screenLogin" class="screen active">
        <h1>Ujian Kepramukaan & Umum</h1>
        <div class="subtitle">Format Pilihan Ganda: 100 Soal Diacak dari 315 Bank Soal</div>
        
        <div class="form-group">
            <input type="text" id="participantName" placeholder="Masukkan Nama Lengkap Anda" autocomplete="off">
        </div>
        <div class="form-group">
            <button class="btn-primary" onclick="startExam()">Mulai Ujian (10 Menit)</button>
        </div>
        
        <div style="text-align:center; margin-top:50px; border-top:1px solid #eee; padding-top:20px;">
            <p style="font-size:12px; color:#667085;">Menu Pembina / Admin</p>
            <button class="btn-admin" onclick="alert('Data nilai otomatis tersimpan di Google Sheets Anda.')">📥 Lihat Nilai di Google Sheets</button>
            <button class="btn-admin" onclick="clearDatabase()" style="background:#b42318;">Hapus Riwayat di Perangkat Ini</button>
        </div>
    </div>

    <div id="screenExam" class="screen">
        <div class="exam-header">
            <div><strong>Peserta:</strong> <span id="displayName"></span></div>
            <div class="timer">Waktu: <span id="timeDisplay">10:00</span></div>
        </div>
        
        <div class="progress-info" id="progressInfo">Halaman 1</div>
        
        <div id="questionsContainer"></div>
        
        <div class="pagination">
            <button class="btn-nav" id="btnPrev" onclick="changePage(-1)">&#8592; Sebelumnya</button>
            <button class="btn-nav" id="btnNext" onclick="changePage(1)">Selanjutnya &#8594;</button>
            <button class="btn-submit" id="btnSubmit" onclick="submitExam()">Kumpulkan Ujian</button>
        </div>
    </div>

    <div id="screenResult" class="screen">
        <div class="result-box">
            <h2>Ujian Selesai!</h2>
            <p>Nama: <strong id="resultName"></strong></p>
            <div style="font-size: 18px; margin-top:20px;">Skor Akhir Anda (Skala 100):</div>
            <div class="score" id="resultScore">0</div>
            <p id="resultDetail" style="color:#667085;"></p>
            
            <div id="previousScoresContainer" class="history-box">
                <h3 class="history-title">Riwayat Nilai Sebelumnya</h3>
                <ul id="previousScoresList" class="history-list"></ul>
            </div>

            <div class="action-buttons">
                <button class="btn-secondary" onclick="retakeExam()">🔄 Kerjakan Ulang (Soal Diacak Baru)</button>
                <button class="btn-admin" onclick="location.reload()" style="background: #667085; width:100%; max-width:350px;">Ganti Peserta / Ke Halaman Awal</button>
            </div>
        </div>
    </div>
</div>

    ["Sejarah Tangerang", "Pemekaran wilayah Kabupaten Tangerang yang kedua kalinya disahkan pada tahun 2008, melahirkan otonomi baru yaitu...", "Kota Tangerang Selatan (Tangsel)", "Kabupaten Serang", "Kota Depok", "Kota Cilegon", 0]
];

let totalQuestionsInExam = 0; 
const questionsPerPage = 10;
let timeRemaining = 600; // 10 Menit

let examQuestions = [];
let userAnswers = [];
let currentPage = 0;
let timerInterval;
let currentUser = "";

function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

// Menyiapkan soal untuk ujian yang dicampur (Hybrid mode)
function prepareExamQuestions() {
    
    function formatToMultipleChoice(rawList) {
        return rawList.map(q => {
            // Jika formatnya Lengkap / Manual (Punya pengecoh A,B,C,D) -> array length >= 7
            if (q.length >= 7) {
                let optionsList = [
                    { text: q[2], isCorrect: true },
                    { text: q[3], isCorrect: false },
                    { text: q[4], isCorrect: false },
                    { text: q[5], isCorrect: false }
                ];
                shuffle(optionsList);
                return {
                    category: q[0],
                    text: q[1],
                    options: optionsList.map(opt => opt.text),
                    answer: optionsList.findIndex(opt => opt.isCorrect)
                };
            } 
            // Jika formatnya hanya Soal dan Kunci Jawaban (Data baru PK) -> Buat Pengecoh Dinamis dari Bank Soal!
            else {
                let correctAns = q[2];
                
                // Ambil semua jawaban unik dari kategori yang sama sebagai calon pengecoh
                let allPossibleFakes = [...new Set(rawList.map(item => item[2]).filter(item => item !== correctAns))];
                shuffle(allPossibleFakes);
                
                // Ambil 3 jawaban palsu secara acak
                let selectedFakes = allPossibleFakes.slice(0, 3);
                
                // Fallback jika bank soal kurang
                while(selectedFakes.length < 3) {
                    selectedFakes.push("Jawaban Opsi " + (selectedFakes.length + 1));
                }
                
                let optionsList = [
                    { text: correctAns, isCorrect: true },
                    { text: selectedFakes[0], isCorrect: false },
                    { text: selectedFakes[1], isCorrect: false },
                    { text: selectedFakes[2], isCorrect: false }
                ];
                shuffle(optionsList);
                
                return {
                    category: q[0],
                    text: q[1],
                    options: optionsList.map(opt => opt.text),
                    answer: optionsList.findIndex(opt => opt.isCorrect)
                };
            }
        });
    }

    let puRaw = rawData.filter(q => q[0] === "PU");
    let pkRaw = rawData.filter(q => q[0] === "PK");
    let sejarahRaw = rawData.filter(q => q[0] === "Sejarah Tangerang");

    let puQuestions = formatToMultipleChoice(puRaw);
    let pkQuestions = formatToMultipleChoice(pkRaw);
    let sejarahQuestions = formatToMultipleChoice(sejarahRaw);

    // Acak keseluruhan stok soal di tiap kategori
    shuffle(puQuestions);
    shuffle(pkQuestions);
    shuffle(sejarahQuestions);

    // Ambil porsi ujian: 40 PU, 40 PK, 20 Sejarah (Total 100)
    let selectedPU = puQuestions.slice(0, 40); 
    let selectedPK = pkQuestions.slice(0, 40); 
    let selectedSejarah = sejarahQuestions.slice(0, 20); 

    let combinedQuestions = [...selectedPU, ...selectedPK, ...selectedSejarah];
    
    // Acak urutan keluarnya 100 soal tersebut agar campur aduk
    shuffle(combinedQuestions);

    examQuestions = combinedQuestions;
    totalQuestionsInExam = examQuestions.length;
}

function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

function startExam() {
    const nameInput = document.getElementById("participantName").value.trim();
    if(!nameInput) {
        alert("Harap masukkan nama Anda terlebih dahulu!");
        return;
    }
    
    currentUser = nameInput;
    document.getElementById("displayName").textContent = currentUser;
    
    prepareExamQuestions();
    
    userAnswers = new Array(totalQuestionsInExam).fill(null);
    currentPage = 0;
    timeRemaining = 600; 
    
    renderPage();
    switchScreen('screenExam');
    
    document.getElementById("timeDisplay").textContent = formatTime(timeRemaining);
    timerInterval = setInterval(() => {
        timeRemaining--;
        document.getElementById("timeDisplay").textContent = formatTime(timeRemaining);
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            forceSubmitExam();
        }
    }, 1000);
}

function retakeExam() {
    prepareExamQuestions();
    
    userAnswers = new Array(totalQuestionsInExam).fill(null);
    currentPage = 0;
    timeRemaining = 600;
    
    renderPage();
    switchScreen('screenExam');
    
    clearInterval(timerInterval);
    document.getElementById("timeDisplay").textContent = formatTime(timeRemaining);
    timerInterval = setInterval(() => {
        timeRemaining--;
        document.getElementById("timeDisplay").textContent = formatTime(timeRemaining);
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            forceSubmitExam();
        }
    }, 1000);
}

function renderPage() {
    const container = document.getElementById("questionsContainer");
    container.innerHTML = "";
    
    const startIndex = currentPage * questionsPerPage;
    const endIndex = Math.min(startIndex + questionsPerPage, totalQuestionsInExam);
    
    const pageQuestions = examQuestions.slice(startIndex, endIndex);
    
    pageQuestions.forEach((q, localIndex) => {
        const globalIndex = startIndex + localIndex;
        let optionsHTML = "";
        
        q.options.forEach((opt, optIndex) => {
            const isChecked = userAnswers[globalIndex] === optIndex ? "checked" : "";
            optionsHTML += `
                <label class="option-label">
                    <input type="radio" name="q${globalIndex}" value="${optIndex}" onchange="saveAnswer(${globalIndex}, ${optIndex})" ${isChecked}>
                    ${String.fromCharCode(65 + optIndex)}. ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-card">
                <div class="question-category">${q.category}</div>
                <div class="question-text">${globalIndex + 1}. ${q.text}</div>
                <div class="options">
                    ${optionsHTML}
                </div>
            </div>
        `;
    });
    
    updatePaginationUI();
    window.scrollTo(0, 0);
}

function saveAnswer(globalIndex, answerIndex) {
    userAnswers[globalIndex] = parseInt(answerIndex);
}

function changePage(direction) {
    currentPage += direction;
    renderPage();
}

function updatePaginationUI() {
    const totalPages = Math.ceil(totalQuestionsInExam / questionsPerPage);
    document.getElementById("progressInfo").textContent = `Halaman ${currentPage + 1} dari ${totalPages} (Soal ${currentPage * 10 + 1} - ${Math.min((currentPage + 1) * 10, totalQuestionsInExam)})`;
    
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnSubmit = document.getElementById("btnSubmit");
    
    btnPrev.disabled = (currentPage === 0);
    
    if (currentPage === totalPages - 1) {
        btnNext.style.display = "none";
        btnSubmit.style.display = "inline-block";
    } else {
        btnNext.style.display = "inline-block";
        btnSubmit.style.display = "none";
    }
}

function submitExam() {
    if(confirm("Apakah Anda yakin ingin mengumpulkan seluruh jawaban Anda?")) {
        processResults();
    }
}

function forceSubmitExam() {
    alert("Waktu pengerjaan habis! Sistem mengumpulkan jawaban Anda otomatis.");
    processResults();
}

// LOGIKA PENILAIAN PILIHAN GANDA
function processResults() {
    clearInterval(timerInterval);

    let correctCount = 0;

    examQuestions.forEach((q, index) => {
        if(userAnswers[index] === q.answer) {
            correctCount++;
        }
    });

    const finalScore = Math.round((correctCount / totalQuestionsInExam) * 100);

    document.getElementById("resultName").textContent = currentUser;
    document.getElementById("resultScore").textContent = finalScore;
    document.getElementById("resultDetail").textContent = `Anda berhasil menjawab benar ${correctCount} dari total ${totalQuestionsInExam} soal.`;
    
    let db = JSON.parse(localStorage.getItem('pramukaTulisDb') || '[]');
    let pastAttempts = db.filter(entry => entry.nama.toLowerCase() === currentUser.toLowerCase());
    
    const prevContainer = document.getElementById("previousScoresContainer");
    const prevList = document.getElementById("previousScoresList");
    prevList.innerHTML = "";

    if (pastAttempts.length > 0) {
        prevContainer.style.display = "block";
        pastAttempts.forEach((attempt, idx) => {
            let li = document.createElement("li");
            li.innerHTML = `<span>Percobaan ${idx + 1} (${attempt.waktu})</span> <strong>Skor: ${attempt.nilai}</strong>`;
            prevList.appendChild(li);
        });
    } else {
        prevContainer.style.display = "none";
    }
    
    saveToDatabase(currentUser, finalScore, correctCount, totalQuestionsInExam);
    
    switchScreen('screenResult');
    window.scrollTo(0,0);
}

function saveToDatabase(name, score, correct, total) {
    let now = new Date();
    let dateStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID');
    
    let db = JSON.parse(localStorage.getItem('pramukaTulisDb') || '[]');
    db.push({ nama: name, nilai: score, benar: correct, totalSoal: total, waktu: dateStr });
    localStorage.setItem('pramukaTulisDb', JSON.stringify(db));

    let formData = new FormData();
    formData.append('action', 'insert');
    formData.append('waktu', dateStr);
    formData.append('nama', name);
    formData.append('nilai', score);
    formData.append('benar', correct);
    formData.append('totalSoal', total);

    fetch(scriptURL, { 
        method: 'POST', 
        body: formData 
    })
    .then(response => console.log('Data berhasil terkirim ke Google Sheets!'))
    .catch(error => console.error('Gagal mengirim data!', error.message));
}

function clearDatabase() {
    if(confirm("AWAS: Anda yakin ingin menghapus seluruh riwayat di perangkat ini?")) {
        localStorage.removeItem('pramukaTulisDb');
        alert("Seluruh riwayat berhasil dihapus.");
    }
}
</script>
